# substrate — Gate A for a public Bitspark constellation member.
#
# GENERATED by `atlas gate export` from Bitspark/atlas. Do not edit here; change atlas and re-export.
#
# How it is used: an organization ruleset names this file, at an approved commit of
# Bitspark/atlas-gate, as a required workflow for public members. It runs in the member's own context
# on every pull request and merge-queue entry. It checks out the member's change, and this repository
# AT THE WORKFLOW'S OWN COMMIT, so the checker that runs is the one the ruleset approved, never one the
# pull request supplies.
#
# It needs no token and no self-hosted runner: GitHub-hosted, read-only, credentials not persisted.
# It fails closed: if it cannot identify its own commit, or the policy is missing, it reports an error,
# never a pass that examined nothing.
name: substrate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  substrate:
    name: substrate
    if: github.repository != 'Bitspark/atlas-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: identify the gate commit (fail closed)
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_REF" in
            Bitspark/atlas-gate/.github/workflows/gate.yml@*) ;;
            *) echo "::error::this job must run as Bitspark/atlas-gate's gate.yml, got '$WORKFLOW_REF'; nothing was checked"; exit 1 ;;
          esac
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::the workflow commit is empty; nothing was checked"
            exit 1
          fi
          echo "gate: Bitspark/atlas-gate@$WORKFLOW_SHA"

      - name: check out the member change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: member
          persist-credentials: false

      - name: check out the gate at the workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Bitspark/atlas-gate
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Gate A
        run: |
          set -euo pipefail
          rc=0
          node gate/gate.mjs member > gate-a.txt 2>&1 || rc=$?
          cat gate-a.txt
          {
            echo "### Gate A (Bitspark/atlas-gate@${GITHUB_WORKFLOW_SHA})"
            echo
            echo '```'
            cat gate-a.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
